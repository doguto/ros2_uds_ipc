name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.ros_distro }})
    runs-on: ubuntu-latest
    container:
      image: ros:${{ matrix.ros_distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [jazzy, kilted, rolling]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          rosdep update --rosdistro ${{ matrix.ros_distro }}
          rosdep install --from-paths ros2_uds_ipc --ignore-src -y --rosdistro ${{ matrix.ros_distro }}

      - name: Build
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon build --packages-select ros2_uds_ipc \
            --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

      # The test job runs at the same absolute path, so build/ and install/ are reused as-is.
      - name: Archive workspace
        run: tar -cf workspace.tar build install

      - uses: actions/upload-artifact@v4
        with:
          name: workspace-${{ matrix.ros_distro }}
          path: workspace.tar
          retention-days: 1

  test:
    name: test (${{ matrix.ros_distro }})
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ros:${{ matrix.ros_distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [jazzy, kilted, rolling]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: workspace-${{ matrix.ros_distro }}

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          rosdep update --rosdistro ${{ matrix.ros_distro }}
          rosdep install --from-paths ros2_uds_ipc --ignore-src -y --rosdistro ${{ matrix.ros_distro }}

      - name: Test
        shell: bash
        run: |
          tar -xf workspace.tar
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon test --packages-select ros2_uds_ipc --event-handlers console_direct+
          colcon test-result --verbose
